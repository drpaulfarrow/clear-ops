# Fly.io deployment. One small machine in London, a persistent volume for state and the repos.
# The GitHub workflow creates the app and volume, pushes secrets and deploys; see README.
# The app name can be overridden with a repository variable FLY_APP if "clear-ops" is taken.
app = "clear-ops"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CHANNELS = "telegram,discord"
  DATA_DIR = "/data"
  REPO_DIR = "/data/workspace"
  SELF_REPO_DIR = "/data/self"
  SELF_REPO = "drpaulfarrow/clear-ops"
  # Tiered models (16 Nov 2026, the stability pass). The aliases map to OpenRouter models in src/llm.ts:
  # haiku = DeepSeek V4.1 Flash, sonnet = GLM 5.3, opus = Kimi K3.1 Pro. The flash model stays on the
  # high-volume, low-stakes work (research summaries, drafts, design notes); the chief, which routes every
  # message, and the engineer get GLM; the maintainer, which reviews what the engineer wrote, gets Kimi.
  CHIEF_MODEL = "sonnet"
  WORKER_MODEL = "haiku"
  ENGINEER_MODEL = "sonnet"
  MAINTAINER_MODEL = "opus"
  DESIGN_MODEL = "haiku"
  # Changes to ClearOps itself are reviewed by the maintainer and merged by Paul ("maintainer" to undo).
  SELF_MERGE = "paul"
  # The Agent SDK's own per-run guard, measured with its rounded-up estimate (about fifty times what
  # OpenRouter really charges). It is not a bill and never a job's cap: it only stops a run that has
  # gone badly wrong. A job's own cap, when one is set (JOB_BUDGET_USD and friends), counts the
  # provider's real money instead, call by call.
  SDK_RUNAWAY_BUDGET_USD = "1000"
  # Engineering jobs per repository that may run at once, each in its own working copy.
  ENGINEER_SLOTS = "2"
  # And across all repositories together. Four per repository across five repositories (up to twenty
  # coding agents) on four shared cores took the service down on 14 Nov 2026: shared cores are
  # throttled under sustained load and the health check stopped answering. Raise only with a bigger machine.
  ENGINEER_TOTAL = "3"

[[mounts]]
  source = "clear_ops_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # the scheduler must keep running
  auto_start_machines = true
  min_machines_running = 1

# A rolling deploy only retires the old machine once the new one answers /health.
[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

# Agents run coding subprocesses that typecheck and test on every change. On one shared core with
# 2 GB the health check timed out and Telegram polling failed whenever two jobs ran at once.
[[vm]]
  size = "shared-cpu-4x"
  memory = "4gb"

# If the process crashes, bring the machine back rather than leaving it stopped.
[[restart]]
  policy = "always"
