# Fly.io deployment. One small machine in London, a persistent volume for state and the repos.
# The GitHub workflow creates the app and volume, pushes secrets and deploys; see README.
# The app name can be overridden with a repository variable FLY_APP if "clear-ops" is taken.
app = "clear-ops"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CHANNELS = "telegram,discord"
  DATA_DIR = "/data"
  REPO_DIR = "/data/workspace"
  SELF_REPO_DIR = "/data/self"
  SELF_REPO = "drpaulfarrow/clear-ops"
  CHIEF_MODEL = "opus"
  WORKER_MODEL = "sonnet"
  ENGINEER_MODEL = "opus"
  JOB_BUDGET_USD = "5"

[[mounts]]
  source = "clear_ops_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # the scheduler must keep running
  auto_start_machines = true
  min_machines_running = 1

# A rolling deploy only retires the old machine once the new one answers /health.
[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

# Agents run a coding subprocess with tests; 1 GB was not enough and the machine died.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2gb"

# If the process crashes, bring the machine back rather than leaving it stopped.
[[restart]]
  policy = "always"
