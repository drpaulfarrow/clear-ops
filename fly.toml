# Fly.io deployment. One small machine in London, a persistent volume for state and the repos.
# The GitHub workflow creates the app and volume, pushes secrets and deploys; see README.
# The app name can be overridden with a repository variable FLY_APP if "clear-ops" is taken.
app = "clear-ops"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CHANNELS = "telegram,discord"
  DATA_DIR = "/data"
  REPO_DIR = "/data/workspace"
  SELF_REPO_DIR = "/data/self"
  SELF_REPO = "drpaulfarrow/clear-ops"
  CHIEF_MODEL = "haiku"
  WORKER_MODEL = "haiku"
  ENGINEER_MODEL = "haiku"
  DESIGN_MODEL = "haiku"
  # Engineering jobs per repository that may run at once (four shared cores), each in its own working
  # copy. Change the number to run more or fewer; above 8 it is refused and the rest queue as usual.
  ENGINEER_SLOTS = "4"

[[mounts]]
  source = "clear_ops_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # the scheduler must keep running
  auto_start_machines = true
  min_machines_running = 1

# A rolling deploy only retires the old machine once the new one answers /health.
[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/health"

# Agents run coding subprocesses that typecheck and test on every change. On one shared core with
# 2 GB the health check timed out and Telegram polling failed whenever two jobs ran at once.
[[vm]]
  size = "shared-cpu-4x"
  memory = "4gb"

# If the process crashes, bring the machine back rather than leaving it stopped.
[[restart]]
  policy = "always"
