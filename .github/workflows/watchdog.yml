# Outside watchdog, requested by Paul on 14 Nov 2026. Runs on GitHub (outside ClearOps) so a
# crashed ClearOps is still detected: it checks the Fly health page every 5 minutes, and after
# 3 failed checks in a row it posts to a Discord webhook (DISCORD_WEBHOOK_URL secret) and
# restarts the app's Fly machines through the existing FLY_API_TOKEN. It posts again once the
# health check passes. A failed check fails the run, which is how the streak below is counted.
# An Actions cache entry remembers that an episode was alerted: exactly one alert and one
# restart attempt per episode, and a hiccup in one run can only delay an alert, never suppress
# it. (If GitHub were to evict that small cache entry mid-episode, one repeat alert/restart
# could occur; the entry is read every 5 minutes while down, so time-based eviction cannot
# happen during an episode.)
name: watchdog
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write  # read the run history; save and clear the alert-state cache entry

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLY_APP: ${{ vars.FLY_APP || 'clear-ops' }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check the ClearOps health page
        id: health
        run: |
          ok=false
          for i in 1 2 3; do
            if curl -fsS --max-time 20 "https://${FLY_APP}.fly.dev/health" 2>/dev/null | grep -q '"ok": *true'; then ok=true; break; fi
            echo "Health check attempt $i failed."
            if [ "$i" -lt 3 ]; then sleep 10; fi
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      - name: Count this workflow's recent failures
        id: streak
        run: |
          streak=0
          # If the API call fails, keep the streak at 0 so no alert or restart fires on a guess;
          # a failed health check still fails the run below, so a real outage keeps counting.
          if conclusions=$(gh api "repos/${{ github.repository }}/actions/workflows/watchdog.yml/runs?status=completed&per_page=10" --jq '.workflow_runs[].conclusion' 2>/dev/null); then
            for c in $conclusions; do
              if [ "$c" = "failure" ]; then streak=$((streak + 1)); else break; fi
            done
          else
            echo "Could not list recent runs; skipping streak-based actions this run."
          fi
          echo "previous_failures=$streak" >> "$GITHUB_OUTPUT"
          echo "Consecutive failed runs before this one: $streak"

      - name: Restore the alert state
        id: alertstate
        uses: actions/cache/restore@v4
        with:
          path: .watchdog-alerted
          key: watchdog-alerted
          lookup-only: true

      - name: Mark the episode as alerted
        if: steps.health.outputs.ok == 'false' && steps.streak.outputs.previous_failures >= '2' && steps.alertstate.outputs.cache-hit != 'true'
        run: date -u > .watchdog-alerted

      # If this save fails, the alert below is skipped (a failed step blocks later steps), the
      # state stays unset, and the next run tries again: an alert is delayed, never lost.
      - name: Save the alert state
        if: steps.health.outputs.ok == 'false' && steps.streak.outputs.previous_failures >= '2' && steps.alertstate.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .watchdog-alerted
          key: watchdog-alerted

      - name: Set up flyctl
        if: steps.health.outputs.ok == 'false' && steps.streak.outputs.previous_failures >= '2' && steps.alertstate.outputs.cache-hit != 'true'
        # Never let a setup hiccup suppress the alert below: GitHub implicitly ANDs every step's
        # if with success(), so without continue-on-error a failed install would skip the alert.
        continue-on-error: true
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Alert in Discord and restart the Fly machines
        if: steps.health.outputs.ok == 'false' && steps.streak.outputs.previous_failures >= '2' && steps.alertstate.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' -d '{"content":"ClearOps health check failed three times. Attempting an automatic restart."}' "$DISCORD_WEBHOOK_URL" || echo "Discord post failed."
          else
            echo "No DISCORD_WEBHOOK_URL secret yet; skipping the Discord post."
          fi
          if [ -n "$FLY_API_TOKEN" ]; then
            ids=$(curl -fsS -H "Authorization: Bearer $FLY_API_TOKEN" "https://api.machines.dev/v1/apps/$FLY_APP/machines" | jq -r '.[].id') || ids=""
            if [ -z "$ids" ]; then
              echo "Could not list the app's machines; skipping the restart."
            else
              echo "Restarting Fly machine(s): $ids"
              flyctl machine restart $ids --app "$FLY_APP" --skip-health-checks || echo "flyctl machine restart failed."
            fi
          else
            echo "No FLY_API_TOKEN secret; cannot restart."
          fi

      - name: Clear the alert state
        if: steps.health.outputs.ok == 'true' && steps.alertstate.outputs.cache-hit == 'true'
        id: clear
        run: |
          # If the state cannot be cleared, skip the recovery post and retry on the next run
          # rather than post a recovery message every 5 minutes.
          if gh api -X DELETE "repos/${{ github.repository }}/actions/caches?key=watchdog-alerted" 2>/dev/null; then
            echo "cleared=true" >> "$GITHUB_OUTPUT"
          else
            echo "cleared=false" >> "$GITHUB_OUTPUT"
            echo "Could not clear the alert state; skipping the recovery post so the next run can try."
          fi

      - name: Report the recovery in Discord
        if: steps.health.outputs.ok == 'true' && steps.alertstate.outputs.cache-hit == 'true' && steps.clear.outputs.cleared == 'true'
        continue-on-error: true
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            curl -fsS -X POST -H 'Content-Type: application/json' -d '{"content":"ClearOps is responding again."}' "$DISCORD_WEBHOOK_URL" || echo "Discord post failed."
          fi

      - name: Fail the run while ClearOps is down
        run: |
          if [ "${{ steps.health.outputs.ok }}" = "true" ]; then echo "ClearOps is healthy."; exit 0; else echo "ClearOps health check failed."; exit 1; fi
