# Tests on every push and pull request. On main, deploys to Fly when a FLY_API_TOKEN secret
# exists: creates the app and volume on first run, pushes the runtime secrets, then deploys.
# Everything is configured from GitHub's Settings > Secrets page; nothing runs on your machine.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP || 'clear-ops' }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - id: check
        run: echo "ready=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ready != 'true'
        run: echo "No FLY_API_TOKEN secret yet; skipping deploy."
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the app and its volume on first run
        if: steps.check.outputs.ready == 'true'
        run: |
          flyctl apps list --json | grep -q "\"Name\": *\"$FLY_APP\"" || flyctl apps create "$FLY_APP"
          flyctl volumes list --app "$FLY_APP" --json | grep -q clear_ops_data || flyctl volumes create clear_ops_data --app "$FLY_APP" --region lhr --size 3 --yes
      - name: Stage runtime secrets from this repository's secrets
        if: steps.check.outputs.ready == 'true'
        env:
          # Actions secrets cannot start with GITHUB_, so they are GH_APP_*; the service reads them as GITHUB_APP_*. Passed through the environment, not pasted into the script: the key is multi-line.
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          # JSON, so through the environment rather than pasted into the script.
          OPENROUTER_PRICES: ${{ vars.OPENROUTER_PRICES }}
        run: |
          flyctl secrets set --app "$FLY_APP" --stage \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            OPENROUTER_HAIKU_MODEL="${{ vars.OPENROUTER_HAIKU_MODEL }}" \
            OPENROUTER_SONNET_MODEL="${{ vars.OPENROUTER_SONNET_MODEL }}" \
            OPENROUTER_OPUS_MODEL="${{ vars.OPENROUTER_OPUS_MODEL }}" \
            OPENROUTER_PRICES="$OPENROUTER_PRICES" \
            EA_MODEL="${{ vars.EA_MODEL }}" \
            BRAVE_API_KEY="${{ secrets.BRAVE_API_KEY }}" \
            EXA_API_KEY="${{ secrets.EXA_API_KEY }}" \
            TRANSCRIBE_API_KEY="${{ secrets.TRANSCRIBE_API_KEY }}" \
            TRANSCRIBE_MODEL="${{ vars.TRANSCRIBE_MODEL }}" \
            TRANSCRIBE_BASE_URL="${{ vars.TRANSCRIBE_BASE_URL }}" \
            VAULT_KEY="${{ secrets.VAULT_KEY }}" \
            GH_TOKEN="${{ secrets.GH_TOKEN }}" \
            TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            ALLOWED_TELEGRAM_IDS="${{ secrets.ALLOWED_TELEGRAM_IDS }}" \
            DISCORD_BOT_TOKEN="${{ secrets.DISCORD_BOT_TOKEN }}" \
            ALLOWED_DISCORD_IDS="${{ secrets.ALLOWED_DISCORD_IDS }}" \
            CHANNELS="${{ vars.CHANNELS || 'telegram,discord' }}" \
            PRODUCT_REPO="${{ secrets.PRODUCT_REPO }}" \
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            GOOGLE_ACCOUNT="${{ secrets.GOOGLE_ACCOUNT }}" \
            GOOGLE_TOKEN_KEY="${{ secrets.GOOGLE_TOKEN_KEY }}" \
            EA_BOOKING_LINK="${{ vars.EA_BOOKING_LINK }}" \
            GODADDY_API_TOKEN="${{ secrets.GODADDY_API_TOKEN }}" \
            GODADDY_API_KEY="${{ secrets.GODADDY_API_KEY }}" \
            GODADDY_API_SECRET="${{ secrets.GODADDY_API_SECRET }}" \
            GODADDY_DOMAINS="${{ vars.GODADDY_DOMAINS }}" \
            GITHUB_APP_ID="$GITHUB_APP_ID" \
            GITHUB_APP_PRIVATE_KEY="$GITHUB_APP_PRIVATE_KEY" \
            GITHUB_APP_INSTALLATION_ID="$GITHUB_APP_INSTALLATION_ID"
      - name: Stage the voice settings (only once Modal is set up)
        if: steps.check.outputs.ready == 'true' && env.MODAL_TOKEN_SECRET != ''
        env:
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          # The Modal gateway's address: workspace "drpaulfarrow", app "clearops-voice". A repository variable overrides it.
          VOICE_GATEWAY_URL: ${{ vars.VOICE_GATEWAY_URL || 'https://drpaulfarrow--clearops-voice.modal.run' }}
        run: |
          # The key the Fly service and the Modal gateway share, derived so Paul has no extra secret to add.
          VOICE_KEY=$(printf 'clear-ops-voice-v1:%s' "$MODAL_TOKEN_SECRET" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$VOICE_KEY"
          flyctl secrets set --app "$FLY_APP" --stage VOICE_KEY="$VOICE_KEY" VOICE_GATEWAY_URL="$VOICE_GATEWAY_URL"
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: flyctl deploy --app "$FLY_APP" --remote-only --strategy rolling
  # The voice GPU on Modal (voice/). Runs beside the Fly deploy, never blocks it: the first image build
  # compiles the speech servers and can take the best part of an hour; later deploys reuse the image.
  voice:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: voice-deploy
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      FLY_APP: ${{ vars.FLY_APP || 'clear-ops' }}
      VOICE_GATEWAY_URL: ${{ vars.VOICE_GATEWAY_URL || 'https://drpaulfarrow--clearops-voice.modal.run' }}
    steps:
      - id: check
        run: echo "ready=${{ secrets.MODAL_TOKEN_ID != '' && secrets.MODAL_TOKEN_SECRET != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ready != 'true'
        run: echo "No MODAL_TOKEN_ID and MODAL_TOKEN_SECRET secrets yet; skipping the voice deploy."
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Test the gateway
        if: steps.check.outputs.ready == 'true'
        run: |
          pip install modal==1.6.4 fastapi==0.162.5 websockets==17.4 sphn==0.2.1 numpy==2.5.3 httpx==0.28.1 uvicorn pytest
          python -m pytest -q voice/test_gateway.py
      - name: Write the Modal secret
        if: steps.check.outputs.ready == 'true'
        run: |
          VOICE_KEY=$(printf 'clear-ops-voice-v1:%s' "$MODAL_TOKEN_SECRET" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$VOICE_KEY"
          modal secret create clearops-voice VOICE_KEY="$VOICE_KEY" CLEAROPS_LLM_URL="https://$FLY_APP.fly.dev/voice" --force > /dev/null
      - name: Deploy the voice app
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          modal deploy voice/voice.py 2>&1 | tee /tmp/modal.log
          url=$(grep -oE 'https://[a-z0-9-]+--clearops-voice\.modal\.run' /tmp/modal.log | head -1 || true)
          echo "Gateway: ${url:-not printed}"
          if [ -n "$url" ] && [ "$url" != "$VOICE_GATEWAY_URL" ]; then
            echo "::warning::The gateway is at $url but Fly is told $VOICE_GATEWAY_URL. Set the repository variable VOICE_GATEWAY_URL to $url and re-run the deploy."
          fi
