# Tests on every push and pull request. On main, deploys to Fly when a FLY_API_TOKEN secret
# exists: creates the app and volume on first run, pushes the runtime secrets, then deploys.
# Everything is configured from GitHub's Settings > Secrets page; nothing runs on your machine.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
  # A deploy restarts the service and interrupts every running job. With the DEPLOY_DRAIN_TOKEN secret
  # set, it first drains: the service holds every new and queued job (POST /deploy/drain), and the
  # running ones get up to 10 minutes to finish before the deploy goes ahead; anything still running
  # resumes its own conversation after the restart, and the held jobs start then. Without the secret, or
  # if the service does not answer the drain, it waits until no worker is running, up to 45 minutes, as
  # before. A newer merge cancels an older run that is still waiting, so merges close together go out as one deploy.
  wait-for-quiet:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    concurrency:
      group: deploy-wait
      cancel-in-progress: true
    env:
      FLY_APP: ${{ vars.FLY_APP || 'clear-ops' }}
      DRAIN_TOKEN: ${{ secrets.DEPLOY_DRAIN_TOKEN }}
    steps:
      - name: Wait until no job is running
        run: |
          url="https://${FLY_APP}.fly.dev/busy"
          # Drain first: no new job starts, so only what is running now is waited for, and not for long.
          rounds=90
          if [ -n "$DRAIN_TOKEN" ]; then
            if curl -fsS --max-time 20 -X POST -H "Authorization: Bearer $DRAIN_TOKEN" -H "content-type: application/json" -d '{"minutes":25}' "https://${FLY_APP}.fly.dev/deploy/drain" >/dev/null 2>&1; then
              echo "Draining: new jobs are held until the deploy restarts the service; waiting up to 10 minutes for the running ones."
              rounds=20
            else
              echo "The service did not take the drain (an older version, or no key there yet); waiting for quiet as before."
            fi
          fi
          # A busy machine can be slow to answer, so one missed answer is not "down": only six in a row
          # (about three minutes) means the service really is not running, and then deploying is the fix.
          misses=0
          for i in $(seq 1 "$rounds"); do
            n=$(curl -fsS --max-time 20 "$url" 2>/dev/null | sed -n 's/.*"running":\([0-9]*\).*/\1/p')
            if [ -z "$n" ]; then
              misses=$((misses + 1))
              if [ "$misses" -ge 6 ]; then echo "No answer from $url six times in a row; the service looks down, deploying now."; exit 0; fi
              echo "No answer from $url ($misses in a row); treating it as busy and checking again in 30 seconds."
              sleep 30
              continue
            fi
            misses=0
            if [ "$n" = "0" ]; then echo "No jobs running; deploying."; exit 0; fi
            echo "$n job(s) running; checking again in 30 seconds ($i/$rounds)."
            sleep 30
          done
          echo "Still busy after $((rounds / 2)) minutes; deploying anyway. Interrupted jobs resume where they were."
  deploy:
    needs: wait-for-quiet
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP || 'clear-ops' }}
    steps:
      - id: check
        run: echo "ready=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ready != 'true'
        run: echo "No FLY_API_TOKEN secret yet; skipping deploy."
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the app and its volume on first run
        if: steps.check.outputs.ready == 'true'
        run: |
          # "Not in the list" and "the list could not be read" are different things. Fly's API failed
          # once on 19 Nov 2026, the old one-liner took that for "no such app" and tried to create it,
          # and the deploy failed on a name already taken. The same slip on the second line would have
          # made a second, empty volume. So a list that cannot be read stops here: nothing is created
          # on a guess, the running service is untouched, and re-running the job is the fix.
          apps=$(flyctl apps list --json) || { echo "Could not read the list of Fly apps, so nothing was created or deployed. Re-run this job."; exit 1; }
          echo "$apps" | grep -q "\"Name\": *\"$FLY_APP\"" || flyctl apps create "$FLY_APP"
          volumes=$(flyctl volumes list --app "$FLY_APP" --json) || { echo "Could not read the list of volumes, so nothing was created or deployed. Re-run this job."; exit 1; }
          echo "$volumes" | grep -q clear_ops_data || flyctl volumes create clear_ops_data --app "$FLY_APP" --region lhr --size 3 --yes
      - name: Stage runtime secrets from this repository's secrets
        if: steps.check.outputs.ready == 'true'
        env:
          # Actions secrets cannot start with GITHUB_, so they are GH_APP_*; the service reads them as GITHUB_APP_*. Passed through the environment, not pasted into the script: the key is multi-line.
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          # JSON, so through the environment rather than pasted into the script.
          OPENROUTER_PRICES: ${{ vars.OPENROUTER_PRICES }}
          # A managed repository the App cannot reach can carry its own token: REPO_TOKENS is a JSON
          # object, alias or owner/name to token, and <ALIAS>_TOKEN does the same for one repository
          # (DOUBLESHIFT_TOKEN for the alias doubleshift). See docs/GITHUB_APP.md.
          REPO_TOKENS: ${{ secrets.REPO_TOKENS }}
          DOUBLESHIFT_TOKEN: ${{ secrets.DOUBLESHIFT_TOKEN }}
        run: |
          flyctl secrets set --app "$FLY_APP" --stage \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            OPENROUTER_DEVICE_API_KEY="${{ secrets.OPENROUTER_DEVICE_API_KEY }}" \
            OPENROUTER_HAIKU_MODEL="${{ vars.OPENROUTER_HAIKU_MODEL }}" \
            OPENROUTER_SONNET_MODEL="${{ vars.OPENROUTER_SONNET_MODEL }}" \
            OPENROUTER_OPUS_MODEL="${{ vars.OPENROUTER_OPUS_MODEL }}" \
            OPENROUTER_FABLE_MODEL="${{ vars.OPENROUTER_FABLE_MODEL }}" \
            OPENROUTER_PRICES="$OPENROUTER_PRICES" \
            EA_MODEL="${{ vars.EA_MODEL }}" \
            BRAVE_API_KEY="${{ secrets.BRAVE_API_KEY }}" \
            EXA_API_KEY="${{ secrets.EXA_API_KEY }}" \
            TRANSCRIBE_API_KEY="${{ secrets.TRANSCRIBE_API_KEY }}" \
            TRANSCRIBE_MODEL="${{ vars.TRANSCRIBE_MODEL }}" \
            TRANSCRIBE_BASE_URL="${{ vars.TRANSCRIBE_BASE_URL }}" \
            VAULT_KEY="${{ secrets.VAULT_KEY }}" \
            GH_TOKEN="${{ secrets.GH_TOKEN }}" \
            REPO_TOKENS="$REPO_TOKENS" \
            DOUBLESHIFT_TOKEN="$DOUBLESHIFT_TOKEN" \
            TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            ALLOWED_TELEGRAM_IDS="${{ secrets.ALLOWED_TELEGRAM_IDS }}" \
            DISCORD_BOT_TOKEN="${{ secrets.DISCORD_BOT_TOKEN }}" \
            ALLOWED_DISCORD_IDS="${{ secrets.ALLOWED_DISCORD_IDS }}" \
            CHANNELS="${{ vars.CHANNELS || 'telegram,discord' }}" \
            PRODUCT_REPO="${{ secrets.PRODUCT_REPO }}" \
            UI_GITHUB_CLIENT_ID="${{ secrets.UI_GITHUB_CLIENT_ID }}" \
            UI_GITHUB_CLIENT_SECRET="${{ secrets.UI_GITHUB_CLIENT_SECRET }}" \
            UI_GITHUB_LOGIN="${{ vars.UI_GITHUB_LOGIN }}" \
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            GOOGLE_ACCOUNT="${{ secrets.GOOGLE_ACCOUNT }}" \
            GOOGLE_TOKEN_KEY="${{ secrets.GOOGLE_TOKEN_KEY }}" \
            EA_BOOKING_LINK="${{ vars.EA_BOOKING_LINK }}" \
            GODADDY_API_TOKEN="${{ secrets.GODADDY_API_TOKEN }}" \
            GODADDY_API_KEY="${{ secrets.GODADDY_API_KEY }}" \
            GODADDY_API_SECRET="${{ secrets.GODADDY_API_SECRET }}" \
            GODADDY_DOMAINS="${{ vars.GODADDY_DOMAINS }}" \
            SIGNUP_EMAILS="${{ secrets.SIGNUP_EMAILS }}" \
            INSTINCT_BRIDGE_TOKEN="${{ secrets.INSTINCT_BRIDGE_TOKEN }}" \
            DEPLOY_DRAIN_TOKEN="${{ secrets.DEPLOY_DRAIN_TOKEN }}" \
            BRIDGE_CHAT_ENABLED="${{ vars.BRIDGE_CHAT_ENABLED }}" \
            BRIDGE_CHAT_BUDGET_USD="${{ vars.BRIDGE_CHAT_BUDGET_USD }}" \
            BRIDGE_RETRY_ALLOW="${{ vars.BRIDGE_RETRY_ALLOW }}" \
            BRIDGE_COMMISSION_ALLOW="${{ vars.BRIDGE_COMMISSION_ALLOW }}" \
            BRIDGE_THREAD_GUILD_ID="${{ vars.BRIDGE_THREAD_GUILD_ID }}" \
            BRIDGE_THREAD_PARENT_ID="${{ vars.BRIDGE_THREAD_PARENT_ID }}" \
            OPENROUTER_BRIDGE_API_KEY="${{ secrets.OPENROUTER_BRIDGE_API_KEY }}" \
            OVERSIGHT_SENDER_IDS="${{ vars.OVERSIGHT_SENDER_IDS }}" \
            DEVICE_ENABLED="${{ vars.DEVICE_ENABLED }}" \
            DEVICE_TEST_BUDGET_USD="${{ vars.DEVICE_TEST_BUDGET_USD }}" \
            SIGNUP_SITES="${{ vars.SIGNUP_SITES }}" \
            SIGNUP_TTL_HOURS="${{ vars.SIGNUP_TTL_HOURS }}" \
            SIGNUP_DAILY_CAP="${{ vars.SIGNUP_DAILY_CAP }}" \
            OTP_WAIT_MINUTES="${{ vars.OTP_WAIT_MINUTES }}" \
            OTP_MAIL_WAIT_SECONDS="${{ vars.OTP_MAIL_WAIT_SECONDS }}" \
            OTP_MAX_PER_JOB="${{ vars.OTP_MAX_PER_JOB }}" \
            OTP_MIN_GAP_SECONDS="${{ vars.OTP_MIN_GAP_SECONDS }}" \
            GITHUB_APP_ID="$GITHUB_APP_ID" \
            GITHUB_APP_PRIVATE_KEY="$GITHUB_APP_PRIVATE_KEY" \
            GITHUB_APP_INSTALLATION_ID="$GITHUB_APP_INSTALLATION_ID"
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: flyctl deploy --app "$FLY_APP" --remote-only --strategy rolling
