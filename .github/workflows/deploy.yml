# Tests on every push and pull request. On main, deploys to Fly when a FLY_API_TOKEN secret
# exists: creates the app and volume on first run, pushes the runtime secrets, then deploys.
# Everything is configured from GitHub's Settings > Secrets page; nothing runs on your machine.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP || 'clear-ops' }}
    steps:
      - id: check
        run: echo "ready=${{ secrets.FLY_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ready != 'true'
        run: echo "No FLY_API_TOKEN secret yet; skipping deploy."
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create the app and its volume on first run
        if: steps.check.outputs.ready == 'true'
        run: |
          flyctl apps list --json | grep -q "\"Name\": *\"$FLY_APP\"" || flyctl apps create "$FLY_APP"
          flyctl volumes list --app "$FLY_APP" --json | grep -q clear_ops_data || flyctl volumes create clear_ops_data --app "$FLY_APP" --region lhr --size 3 --yes
      - name: Stage runtime secrets from this repository's secrets
        if: steps.check.outputs.ready == 'true'
        env:
          # Actions secrets cannot start with GITHUB_, so they are GH_APP_*; the service reads them as GITHUB_APP_*. Passed through the environment, not pasted into the script: the key is multi-line.
          GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          # JSON, so through the environment rather than pasted into the script.
          OPENROUTER_PRICES: ${{ vars.OPENROUTER_PRICES }}
        run: |
          flyctl secrets set --app "$FLY_APP" --stage \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
            OPENROUTER_HAIKU_MODEL="${{ vars.OPENROUTER_HAIKU_MODEL }}" \
            OPENROUTER_SONNET_MODEL="${{ vars.OPENROUTER_SONNET_MODEL }}" \
            OPENROUTER_OPUS_MODEL="${{ vars.OPENROUTER_OPUS_MODEL }}" \
            OPENROUTER_PRICES="$OPENROUTER_PRICES" \
            EA_MODEL="${{ vars.EA_MODEL }}" \
            BRAVE_API_KEY="${{ secrets.BRAVE_API_KEY }}" \
            EXA_API_KEY="${{ secrets.EXA_API_KEY }}" \
            TRANSCRIBE_API_KEY="${{ secrets.TRANSCRIBE_API_KEY }}" \
            TRANSCRIBE_MODEL="${{ vars.TRANSCRIBE_MODEL }}" \
            TRANSCRIBE_BASE_URL="${{ vars.TRANSCRIBE_BASE_URL }}" \
            VAULT_KEY="${{ secrets.VAULT_KEY }}" \
            GH_TOKEN="${{ secrets.GH_TOKEN }}" \
            TELEGRAM_BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            ALLOWED_TELEGRAM_IDS="${{ secrets.ALLOWED_TELEGRAM_IDS }}" \
            DISCORD_BOT_TOKEN="${{ secrets.DISCORD_BOT_TOKEN }}" \
            ALLOWED_DISCORD_IDS="${{ secrets.ALLOWED_DISCORD_IDS }}" \
            CHANNELS="${{ vars.CHANNELS || 'telegram,discord' }}" \
            PRODUCT_REPO="${{ secrets.PRODUCT_REPO }}" \
            GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
            GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            GOOGLE_ACCOUNT="${{ secrets.GOOGLE_ACCOUNT }}" \
            GOOGLE_TOKEN_KEY="${{ secrets.GOOGLE_TOKEN_KEY }}" \
            EA_BOOKING_LINK="${{ vars.EA_BOOKING_LINK }}" \
            GODADDY_API_TOKEN="${{ secrets.GODADDY_API_TOKEN }}" \
            GODADDY_API_KEY="${{ secrets.GODADDY_API_KEY }}" \
            GODADDY_API_SECRET="${{ secrets.GODADDY_API_SECRET }}" \
            GODADDY_DOMAINS="${{ vars.GODADDY_DOMAINS }}" \
            SIGNUP_EMAILS="${{ secrets.SIGNUP_EMAILS }}" \
            SIGNUP_SITES="${{ vars.SIGNUP_SITES }}" \
            SIGNUP_TTL_HOURS="${{ vars.SIGNUP_TTL_HOURS }}" \
            SIGNUP_DAILY_CAP="${{ vars.SIGNUP_DAILY_CAP }}" \
            GITHUB_APP_ID="$GITHUB_APP_ID" \
            GITHUB_APP_PRIVATE_KEY="$GITHUB_APP_PRIVATE_KEY" \
            GITHUB_APP_INSTALLATION_ID="$GITHUB_APP_INSTALLATION_ID"
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: flyctl deploy --app "$FLY_APP" --remote-only --strategy rolling
